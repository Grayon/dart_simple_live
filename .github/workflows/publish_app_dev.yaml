name: app-dev-build-action

on:
  push:
    tags:
      - "dev_v*"
  workflow_dispatch:
    inputs:
      jobs:
        description: "选择要运行的 Job（不选则全跑）"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - build-android
          - build-mac-ios
          - build-ios
          - build-mac
          - build-linux
          - build-windows

jobs:
  # 打包Android（Ubuntu runner 更快更省）
  build-android:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-android'
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      # 签出代码
      - uses: actions/checkout@v5
        with:
          ref: dev

      # 从 Tag 同步版本号到 pubspec.yaml（确保 App 内显示版本与 Tag 一致）
      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 .github/scripts/sync_version.py --tag "$TAG" --pubspec simple_live_app/pubspec.yaml

      # APK签名设置
      - name: Decode Android keystore
        id: android_keystore
        shell: bash
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/keystore.jks"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "filePath=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 设置JAVA环境
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 打包APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      #拆分3架构APK为独立artifact，方便单独下载
      - name: Upload APK to Artifacts (arm64-v8a)
        uses: actions/upload-artifact@v5
        with:
          name: android-arm64-v8a
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Upload APK to Artifacts (armeabi-v7a)
        uses: actions/upload-artifact@v5
        with:
          name: android-armeabi-v7a
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - name: Upload APK to Artifacts (x86_64)
        uses: actions/upload-artifact@v5
        with:
          name: android-x86_64
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      #完成
      - run: echo "🤖 Android job status is ${{ job.status }}"

  # 打包iOS + Mac（Xcode 仅支持 macOS runner）
  build-mac-ios:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-ios' || inputs.jobs == 'build-mac'
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      # 签出代码
      - uses: actions/checkout@v5
        with:
          ref: dev

      # 从 Tag 同步版本号到 pubspec.yaml（确保 App 内显示版本与 Tag 一致）
      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 .github/scripts/sync_version.py --tag "$TAG" --pubspec simple_live_app/pubspec.yaml

      # 设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-mac') }}
        run: flutter config --enable-macos-desktop

      # 更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 安装 flutter_distributor
      - name: Install flutter_distributor
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-mac') }}
        run: dart pub global activate flutter_distributor

      #打包iOS
      - name: Build IPA
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-ios') }}
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      #创建未签名ipa
      - name: Create IPA
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-ios') }}
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../..

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-ios') }}
        uses: actions/upload-artifact@v5
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 用 flutter_distributor 一步打包 macOS zip
      - name: Package macOS zip
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-mac') }}
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets zip --skip-clean

      # 上传MAC至Artifacts
      - name: Upload MacOS to Artifacts
        if: ${{ (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-mac-ios' || inputs.jobs == 'build-mac') }}
        uses: actions/upload-artifact@v5
        with:
          name: mac
          path: |
            simple_live_app/build/dist/**/*.zip
      #完成
      - run: echo "🍏 iOS+macOS job status is ${{ job.status }}"

  # 打包Linux
  build-linux:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-linux'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v5
        with:
          ref: dev
      # 从 Tag 同步版本号到 pubspec.yaml（确保 App 内显示版本与 Tag 一致）
      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 .github/scripts/sync_version.py --tag "$TAG" --pubspec simple_live_app/pubspec.yaml
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      # 打开Linux Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Linux ZIP\DMG
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean
      # 上传Linux包至Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

        #完成
      - run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包Windows
  build-windows:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'build-windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v5
        with:
          ref: dev
      # 从 Tag 同步版本号到 pubspec.yaml（确保 App 内显示版本与 Tag 一致）
      - name: Sync version from tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 .github/scripts/sync_version.py --tag "$TAG" --pubspec simple_live_app/pubspec.yaml
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean
      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
        #完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."
