name: tv-app-dev-build-action
#推送Tag时触发
on:
    push:
        tags:
            - "dev_tv_v*"
    workflow_dispatch:
        inputs:
            run_build:
                description: "是否运行构建"
                required: false
                default: true
                type: boolean
jobs:
    build-tv:
        if: github.event_name == 'push' || inputs.run_build == true
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        steps:
            #签出代码
            - uses: actions/checkout@v5
              with:
                  ref: dev

            #APK签名设置
            - name: Decode Android keystore
              id: android_tv_keystore
              shell: bash
              run: |
                  KEYSTORE_PATH="${{ runner.temp }}/keystore.jks"
                  printf '%s' "${{ secrets.TV_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
                  echo "filePath=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            - name: Create key.properties
              run: |
                  echo "storeFile=${{ steps.android_tv_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
                  echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
                  echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
                  echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

            # 设置JAVA环境
            - uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"

            #设置Flutter
            - name: Flutter action
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.38.x"
                  cache: true

            #更新Flutter的packages
            - name: Restore packages
              run: |
                  cd simple_live_tv_app
                  flutter pub get

            #打包APK
            - name: Build APK
              run: |
                  cd simple_live_tv_app
                  flutter build apk --release --split-per-abi

            #拆分3架构APK为独立artifact，方便单独下载
            - name: Upload APK to Artifacts (arm64-v8a)
              uses: actions/upload-artifact@v5
              with:
                  name: android_tv-arm64-v8a
                  path: |
                      simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            - name: Upload APK to Artifacts (armeabi-v7a)
              uses: actions/upload-artifact@v5
              with:
                  name: android_tv-armeabi-v7a
                  path: |
                      simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            - name: Upload APK to Artifacts (x86_64)
              uses: actions/upload-artifact@v5
              with:
                  name: android_tv-x86_64
                  path: |
                      simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            #完成
            - run: echo "🍏 This job's status is ${{ job.status }}."
